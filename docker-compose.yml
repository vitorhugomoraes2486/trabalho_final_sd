services:
  mestre-app:
    build: 
      context: .
      dockerfile: mestre/Dockerfile
    container_name: mestre-app 
    restart: always
    ports:
      - "5000:5000"
    networks:
      distribuidos-net:
        aliases:
          - mestre-crack.local  # Nome lógico do Mestre na rede Docker.
                                # Resolve automaticamente para o container mestre-app.
                                # Fora do Docker, configurado no arquivo hosts do SO.
                                # Implementa a Transparência de Localização do sistema.
    depends_on:
      - postgres-master

  postgres-master:
    # Master DB — banco de ESCRITA exclusiva.
    # Recebe todos os INSERTs e UPDATEs do Mestre Flask
    # (criação de lotes, reserva de tarefas, flag de término).
    # Configurado com wal_level=replica para habilitar a replicação
    # física dos logs WAL para o Slave DB.
    image: postgres:15
    container_name: postgres-master
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mestre_senha123
      POSTGRES_DB: crack_db
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica" # Habilita envio de logs WAL para réplicas
      - "-c"
      - "max_wal_senders=10" # Máximo de conexões de replicação simultâneas
      - "-c"
      - "max_replication_slots=10" # Slots para garantir que o Slave não perca logs
      - "-c"
      - "hot_standby=on" # Permite que o Slave aceite leituras enquanto replica
    volumes:
      - master-data:/var/lib/postgresql/data
      - ./mestre-init/init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh
    ports:
      - "5432:5432"
    networks:
      - distribuidos-net

  postgres-slave:
    # Slave DB — banco de LEITURA exclusiva.
    # Recebe os dados espelhados do Master via Streaming Replication (WAL).
    # Consultado pelos Workers para buscar lotes disponíveis (SELECT),
    # separando o tráfego de leitura do tráfego de escrita.
    # O entrypoint customizado (standby-setup.sh) clona o Master na
    # primeira execução e configura o modo standby automaticamente.
    image: postgres:15
    container_name: postgres-slave
    entrypoint: ["/standby-setup.sh"]
    volumes:
      - slave-data:/var/lib/postgresql/data
      - ./slave-init/standby-setup.sh:/standby-setup.sh
    ports:
      - "5433:5432"
    depends_on:
      - postgres-master
    networks:
      - distribuidos-net

volumes:
  master-data:
  slave-data:

networks:
  distribuidos-net:
    name: dist_net
    # Rede interna compartilhada por todos os containers do projeto.
    # Permite comunicação pelo nome do serviço (ex: postgres-master)
    # em vez de IPs dinâmicos atribuídos pelo Docker.